[workspace]
resolver = "2"
members = [
    "backend/zk_canister",
    "backend/main_canister",
    "backend/zk_canister_v2"
]

[workspace.dependencies]
candid = "0.9.9"
ic-cdk = "0.11.3"
ic-cdk-macros = "0.8.1"
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"
uuid = { version = "1.3.0", features = ["v4", "js"] }
getrandom = { version = "0.2.10", features = ["js"] }
ark-groth16 = "0.3"
ark-std = "0.3"
ark-crypto-primitives = "0.3"
ic-stable-structures = "0.5"
blake2 = "0.10"
thiserror = "1.0"
halo2_proofs = "0.3.0"
halo2_gadgets = "0.3.0"
pasta_curves = "0.5.0"
rand = "0.8"
ff = "0.13"
group = "0.13"
sha2 = "0.10.7"
hex = "0.4.3" 